name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # CI runs against the drivers that need no third-party account, which is what makes the
  # pipeline hermetic: no Supabase project, no Bunny key, no flake from someone else's uptime.
  DATA_DRIVER: memory
  VIDEO_DRIVER: fake
  ROOT_DOMAIN: mehfil.localhost:3000
  SESSION_SECRET: ci-session-secret-0123456789abcdefghijklmnopqrst

jobs:
  verify:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit and component tests
        run: pnpm test

      - name: Palette contrast gate
        run: pnpm check:contrast

      - name: Build
        run: pnpm build

  e2e:
    name: End-to-end journeys
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright
        run: pnpm test:e2e
        env:
          # Playwright's own server needs a writable store per run; memory keeps runs isolated.
          DATA_DRIVER: memory

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
