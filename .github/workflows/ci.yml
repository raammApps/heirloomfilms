name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # CI runs against the drivers that need no third-party account, which is what makes the
  # pipeline hermetic: no Supabase project, no Bunny key, no flake from someone else's uptime.
  DATA_DRIVER: memory
  VIDEO_DRIVER: fake
  ROOT_DOMAIN: heirloom.localhost:3000
  SESSION_SECRET: ci-session-secret-0123456789abcdefghijklmnopqrst

jobs:
  verify:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit and component tests
        run: pnpm test:ci

      # Renders pass/fail as a table in the run summary and inline on the diff, so a red build
      # says which assertion failed without anyone opening the log.
      - name: Test report
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Unit and component tests
          path: reports/vitest.json
          reporter: vitest-json
          fail-on-error: false

      - name: Coverage summary
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            node -e "
              const c = require('./coverage/coverage-summary.json').total;
              const row = (k) => \`| \${k} | \${c[k].pct}% | \${c[k].covered}/\${c[k].total} |\`;
              console.log('| | covered | |');
              console.log('|---|---|---|');
              ['statements','branches','functions','lines'].forEach(k => console.log(row(k)));
            " >> "$GITHUB_STEP_SUMMARY"
          fi

      # Code nothing imports, and dependencies nothing uses. Caught here so it never accumulates
      # — it already found an unused `framer-motion` and a photo cap that enforced nothing.
      - name: Dead code and unused dependencies
        run: pnpm check:dead

      - name: Palette contrast gate
        run: pnpm check:contrast

      - name: Build
        run: pnpm build

      # doc 05 §6: the browse page has 150KB gzip of first-load JS. It sat at 146KB with
      # nothing watching it, which is how a budget quietly stops being one.
      - name: First-load JS budget
        run: pnpm check:bundle

      - name: Install Chromium for the vitals gate
        run: pnpm exec playwright install --with-deps chromium

      # LCP and CLS on the page every guest lands on (doc 05 §1). Not Lighthouse: its simulated
      # throttling moves by hundreds of milliseconds between identical commits on shared runners,
      # which buys either a threshold that catches nothing or a red build that gets muted.
      - name: Core Web Vitals budget
        run: pnpm check:vitals

  e2e:
    name: End-to-end journeys
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install browsers
        run: pnpm exec playwright install --with-deps chromium

      # Covers the six journeys in doc 10 §2, the OG size budget (doc 10 §1 test 11) and the
      # zero-axe-violations gate (doc 10 §4).
      - name: Run Playwright
        run: pnpm test:e2e
        env:
          # Playwright's own server needs a writable store per run; memory keeps runs isolated.
          DATA_DRIVER: memory

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
