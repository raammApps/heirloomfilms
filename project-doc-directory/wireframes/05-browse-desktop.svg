"119.5" font-size="10" font-weight="700" fill="#d11a2a" text-anchor="middle">1</text><text x="1086" y="120" font-size="11" fill="#14161a">Desktop is the enhancement. Build mobile first.</text><text x="1086" y="134" font-size="11" fill="#14161a">Billboard crop switches 3:4 → 16:9 at md.</text><circle cx="1069" cy="160" r="9" fill="#fff" stroke="#d11a2a" stroke-width="1.4"/><text x="1069" y="163.5" font-size="10" font-weight="700" fill="#d11a2a" text-anchor="middle">2</text><text x="1086" y="164" font-size="11" fill="#14161a">Arrows only under (hover:hover) and</text><text x="1086" y="178" font-size="11" fill="#14161a">(pointer:fine). Scroll by</text><text x="1086" y="192" font-size="11" fill="#14161a">floor(containerWidth/cardWidth)*cardWidth —</text><text x="1086" y="206" font-size="11" fill="#14161a">whole cards, never a fractional offset that</text><text x="1086" y="220" font-size="11" fill="#14161a">half-cuts a card on the left.</text><circle cx="1069" cy="246" r="9" fill="#fff" stroke="#d11a2a" stroke-width="1.4"/><text x="1069" y="249.5" font-size="10" font-weight="700" fill="#d11a2a" text-anchor="middle">!</text><text x="1086" y="250" font-size="11" fill="#14161a">Rows break the right margin deliberately so the</text><text x="1086" y="264" font-size="11" fill="#14161a">next card peeks. Do not contain them inside the</text><text x="1086" y="278" font-size="11" fill="#14161a">grid margin.</text></svg>