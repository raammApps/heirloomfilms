d6" stroke-width="0.8"/><rect x="176" y="396" width="98" height="132" rx="6" fill="#e3e6ea" stroke="#c9ced6" stroke-width="1.2" opacity="1"/><line x1="176" y1="528" x2="274" y2="396" stroke="#c9ced6" stroke-width="0.8"/><line x1="176" y1="396" x2="274" y2="528" stroke="#c9ced6" stroke-width="0.8"/><rect x="286" y="396" width="98" height="132" rx="6" fill="#e3e6ea" stroke="#c9ced6" stroke-width="1.2" opacity="1"/><line x1="286" y1="528" x2="384" y2="396" stroke="#c9ced6" stroke-width="0.8"/><line x1="286" y1="396" x2="384" y2="528" stroke="#c9ced6" stroke-width="0.8"/><rect x="396" y="396" width="98" height="132" rx="6" fill="#e3e6ea" stroke="#c9ced6" stroke-width="1.2" opacity="1"/><line x1="396" y1="528" x2="494" y2="396" stroke="#c9ced6" stroke-width="0.8"/><line x1="396" y1="396" x2="494" y2="528" stroke="#c9ced6" stroke-width="0.8"/><text x="66" y="558" font-family="Inter, Helvetica, Arial, sans-serif" font-size="8" font-weight="400" fill="#6b7280" text-anchor="start" letter-spacing="0">presented by Saanjh Weddings</text><rect x="600" y="150" width="480" height="460" rx="8" fill="#fff" stroke="#14161a" stroke-width="1.5" opacity="1"/><text x="600" y="134" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#14161a" text-anchor="start" letter-spacing="0">The Wedding Atelier</text><rect x="618" y="162" width="66" height="12" rx="3" fill="#3c5a72" stroke="none" stroke-width="1.2" opacity="1"/><rect x="1004" y="159" width="58" height="18" rx="9" fill="#3c5a72" stroke="none" stroke-width="1.2" opacity="1"/><line x1="600" y1="186" x2="1080" y2="186" stroke="#9aa1ab" stroke-width="1.2"/><rect x="600" y="186" width="480" height="186" rx="0" fill="#e3e6ea" stroke="#c9ced6" stroke-width="1.2" opacity="1"/><line x1="600" y1="372" x2="1080" y2="186" stroke="#c9ced6" stroke-width="0.8"/><line x1="600" y1="186" x2="1080" y2="372" stroke="#c9ced6" stroke-width="0.8"/><rect x="600" y="298" width="480" height="74" rx="0" fill="#3c5a72" stroke="none" stroke-width="1.2" opacity="0.1"/><text x="626" y="334" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#14161a" text-anchor="start" letter-spacing="0">FIRST LOOK</text><rect x="626" y="346" width="76" height="20" rx="10" fill="#3c5a72" stroke="none" stroke-width="1.2" opacity="1"/><rect x="626" y="396" width="98" height="132" rx="6" fill="#e3e6ea" stroke="#c9ced6" stroke-width="1.2" opacity="1"/><line x1="626" y1="528" x2="724" y2="396" stroke="#c9ced6" stroke-width="0.8"/><line x1="626" y1="396" x2="724" y2="528" stroke="#c9ced6" stroke-width="0.8"/><rect x="736" y="396" width="98" height="132" rx="6" fill="#e3e6ea" stroke="#c9ced6" stroke-width="1.2" opacity="1"/><line x1="736" y1="528" x2="834" y2="396" stroke="#c9ced6" stroke-width="0.8"/><line x1="736" y1="396" x2="834" y2="528" stroke="#c9ced6" stroke-width="0.8"/><rect x="846" y="396" width="98" height="132" rx="6" fill="#e3e6ea" stroke="#c9ced6" stroke-width="1.2" opacity="1"/><line x1="846" y1="528" x2="944" y2="396" stroke="#c9ced6" stroke-width="0.8"/><line x1="846" y1="396" x2="944" y2="528" stroke="#c9ced6" stroke-width="0.8"/><rect x="956" y="396" width="98" height="132" rx="6" fill="#e3e6ea" stroke="#c9ced6" stroke-width="1.2" opacity="1"/><line x1="956" y1="528" x2="1054" y2="396" stroke="#c9ced6" stroke-width="0.8"/><line x1="956" y1="396" x2="1054" y2="528" stroke="#c9ced6" stroke-width="0.8"/><text x="626" y="558" font-family="Inter, Helvetica, Arial, sans-serif" font-size="8" font-weight="400" fill="#6b7280" text-anchor="start" letter-spacing="0">presented by The Wedding Atelier</text><circle cx="1120" cy="300" r="9" fill="#fff" stroke="#d11a2a" stroke-width="1.4"/><text x="1120" y="303.5" font-family="Inter, Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#d11a2a" text-anchor="middle" letter-spacing="0">1</text><circle cx="1149" cy="116" r="9" fill="#fff" stroke="#d11a2a" stroke-width="1.4"/><text x="1149" y="119.5" font-size="10" font-weight="700" fill="#d11a2a" text-anchor="middle">1</text><text x="1166" y="120" font-size="11" fill="#14161a">Identical component tree and build. Only the</text><text x="1166" y="134" font-size="11" fill="#14161a">catalogue row differs: partner name, logo,</text><text x="1166" y="148" font-size="11" fill="#14161a">accent, and the module list. Zero code changes,</text><text x="1166" y="162" font-size="11" fill="#14161a">zero forks.</text><circle cx="1149" cy="188" r="9" fill="#fff" stroke="#d11a2a" stroke-width="1.4"/><text x="1149" y="191.5" font-size="10" font-weight="700" fill="#d11a2a" text-anchor="middle">!</text><text x="1166" y="192" font-size="11" fill="#14161a">Section ORDER and WHICH sections exist are</text><text x="1166" y="206" font-size="11" fill="#14161a">per-catalogue too — that is the differentiator,</text><text x="1166" y="220" font-size="11" fill="#14161a">not just colour. See doc 14.</text><circle cx="1149" cy="246" r="9" fill="#fff" stroke="#d11a2a" stroke-width="1.4"/><text x="1149" y="249.5" font-size="10" font-weight="700" fill="#d11a2a" text-anchor="middle">!</text><text x="1166" y="250" font-size="11" fill="#14161a">Near-black surface is constant across partners.</text><text x="1166" y="264" font-size="11" fill="#14161a">Letting a planner ship a pastel streaming site</text><text x="1166" y="278" font-size="11" fill="#14161a">destroys the thing they are buying.</text></svg>