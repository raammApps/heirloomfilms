th="46" height="4" rx="2" fill="#c9ced6" stroke="none" stroke-width="1.2" opacity="1"/><rect x="520" y="340" width="56" height="62" rx="4" fill="#e3e6ea" stroke="#c9ced6" stroke-width="1.2" opacity="1"/><line x1="520" y1="402" x2="576" y2="340" stroke="#c9ced6" stroke-width="0.8"/><line x1="520" y1="340" x2="576" y2="402" stroke="#c9ced6" stroke-width="0.8"/><rect x="582" y="340" width="56" height="62" rx="4" fill="#e3e6ea" stroke="#c9ced6" stroke-width="1.2" opacity="1"/><line x1="582" y1="402" x2="638" y2="340" stroke="#c9ced6" stroke-width="0.8"/><line x1="582" y1="340" x2="638" y2="402" stroke="#c9ced6" stroke-width="0.8"/><rect x="520" y="408" width="46" height="4" rx="2" fill="#c9ced6" stroke="none" stroke-width="1.2" opacity="1"/><rect x="520" y="418" width="56" height="62" rx="4" fill="#e3e6ea" stroke="#c9ced6" stroke-width="1.2" opacity="1"/><line x1="520" y1="480" x2="576" y2="418" stroke="#c9ced6" stroke-width="0.8"/><line x1="520" y1="418" x2="576" y2="480" stroke="#c9ced6" stroke-width="0.8"/><rect x="582" y="418" width="56" height="62" rx="4" fill="#e3e6ea" stroke="#c9ced6" stroke-width="1.2" opacity="1"/><line x1="582" y1="480" x2="638" y2="418" stroke="#c9ced6" stroke-width="0.8"/><line x1="582" y1="418" x2="638" y2="480" stroke="#c9ced6" stroke-width="0.8"/><rect x="520" y="486" width="46" height="4" rx="2" fill="#c9ced6" stroke="none" stroke-width="1.2" opacity="1"/><rect x="520" y="496" width="56" height="62" rx="4" fill="#e3e6ea" stroke="#c9ced6" stroke-width="1.2" opacity="1"/><line x1="520" y1="558" x2="576" y2="496" stroke="#c9ced6" stroke-width="0.8"/><line x1="520" y1="496" x2="576" y2="558" stroke="#c9ced6" stroke-width="0.8"/><rect x="582" y="496" width="56" height="62" rx="4" fill="#e3e6ea" stroke="#c9ced6" stroke-width="1.2" opacity="1"/><line x1="582" y1="558" x2="638" y2="496" stroke="#c9ced6" stroke-width="0.8"/><line x1="582" y1="496" x2="638" y2="558" stroke="#c9ced6" stroke-width="0.8"/><text x="600.0" y="604" font-family="Inter, Helvetica, Arial, sans-serif" font-size="8.5" font-weight="400" fill="#4b5563" text-anchor="middle" letter-spacing="0">[ 📱 Mobile ]   [ 💻 Desktop ]</text><rect x="510" y="706" width="84" height="28" rx="14.0" fill="none" stroke="#14161a" stroke-width="1.3" opacity="1"/><text x="552.0" y="723.5" font-family="Inter, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="600" fill="#14161a" text-anchor="middle" letter-spacing="0">Preview</text><rect x="602" y="706" width="84" height="28" rx="14.0" fill="#d11a2a" stroke="#d11a2a" stroke-width="1.3" opacity="1"/><text x="644.0" y="723.5" font-family="Inter, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="600" fill="#fff" text-anchor="middle" letter-spacing="0">Publish</text><text x="510" y="754" font-family="Inter, Helvetica, Arial, sans-serif" font-size="8" font-weight="400" fill="#6b7280" text-anchor="start" letter-spacing="0">Draft autosaved 2s ago  ·  Undo</text><circle cx="922" cy="210" r="9" fill="#fff" stroke="#d11a2a" stroke-width="1.4"/><text x="922" y="213.5" font-family="Inter, Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#d11a2a" text-anchor="middle" letter-spacing="0">1</text><circle cx="922" cy="390" r="9" fill="#fff" stroke="#d11a2a" stroke-width="1.4"/><text x="922" y="393.5" font-family="Inter, Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#d11a2a" text-anchor="middle" letter-spacing="0">2</text><circle cx="922" cy="592" r="9" fill="#fff" stroke="#d11a2a" stroke-width="1.4"/><text x="922" y="595.5" font-family="Inter, Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#d11a2a" text-anchor="middle" letter-spacing="0">3</text><circle cx="922" cy="720" r="9" fill="#fff" stroke="#d11a2a" stroke-width="1.4"/><text x="922" y="723.5" font-family="Inter, Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#d11a2a" text-anchor="middle" letter-spacing="0">4</text><circle cx="1149" cy="116" r="9" fill="#fff" stroke="#d11a2a" stroke-width="1.4"/><text x="1149" y="119.5" font-size="10" font-weight="700" fill="#d11a2a" text-anchor="middle">1</text><text x="1166" y="120" font-size="11" fill="#14161a">Drag to reorder AND keyboard reorder (↑/↓ on a</text><text x="1166" y="134" font-size="11" fill="#14161a">grabbed item). Mouse-only is both an a11y</text><text x="1166" y="148" font-size="11" fill="#14161a">failure and a trackpad annoyance.</text><circle cx="1149" cy="174" r="9" fill="#fff" stroke="#d11a2a" stroke-width="1.4"/><text x="1149" y="177.5" font-size="10" font-weight="700" fill="#d11a2a" text-anchor="middle">2</text><text x="1166" y="178" font-size="11" fill="#14161a">Eye toggles enabled without discarding config.</text><text x="1166" y="192" font-size="11" fill="#14161a">Gear opens that module&#x27;s Editor in a side</text><text x="1166" y="206" font-size="11" fill="#14161a">sheet, generated from its Zod schema.</text><circle cx="1149" cy="232" r="9" fill="#fff" stroke="#d11a2a" stroke-width="1.4"/><text x="1149" y="235.5" font-size="10" font-weight="700" fill="#d11a2a" text-anchor="middle">3</text><text x="1166" y="236" font-size="11" fill="#14161a">Contrast validated AT PICK TIME in the UI, live</text><text x="1166" y="250" font-size="11" fill="#14161a">— not as a build failure the operator never</text><text x="1166" y="264" font-size="11" fill="#14161a">sees. Surface stays near-black in every theme;</text><text x="1166" y="278" font-size="11" fill="#14161a">that is not configurable.</text><circle cx="1149" cy="304" r="9" fill="#fff" stroke="#d11a2a" stroke-width="1.4"/><text x="1149" y="307.5" font-size="10" font-weight="700" fill="#d11a2a" text-anchor="middle">4</text><text x="1166" y="308" font-size="11" fill="#14161a">Autosave to draft_modules, debounced 800ms.</text><text x="1166" y="322" font-size="11" fill="#14161a">Publish is separate and explicit, shows a diff</text><text x="1166" y="336" font-size="11" fill="#14161a">summary, then revalidates ISR. Undo stack of</text><text x="1166" y="350" font-size="11" fill="#14161a">20.</text><circle cx="1149" cy="376" r="9" fill="#fff" stroke="#d11a2a" stroke-width="1.4"/><text x="1149" y="379.5" font-size="10" font-weight="700" fill="#d11a2a" text-anchor="middle">!</text><text x="1166" y="380" font-size="11" fill="#14161a">The preview renders the REAL guest component</text><text x="1166" y="394" font-size="11" fill="#14161a">tree against draft modules — never a mock. A</text><text x="1166" y="408" font-size="11" fill="#14161a">second implementation will drift and an</text><text x="1166" y="422" font-size="11" fill="#14161a">operator will publish something they never saw.</text><circle cx="1149" cy="448" r="9" fill="#fff" stroke="#d11a2a" stroke-width="1.4"/><text x="1149" y="451.5" font-size="10" font-weight="700" fill="#d11a2a" text-anchor="middle">!</text><text x="1166" y="452" font-size="11" fill="#14161a">Mobile is the default preview. Templates</text><text x="1166" y="466" font-size="11" fill="#14161a">(&#x27;Wedding — full&#x27;, &#x27;Anniversary&#x27;) are what make</text><text x="1166" y="480" font-size="11" fill="#14161a">30 minutes achievable.</text></svg>