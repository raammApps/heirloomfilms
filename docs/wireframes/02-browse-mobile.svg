="304" y2="850" stroke="#c9ced6" stroke-width="0.8"/><rect x="266" y="708" width="32" height="12" rx="3" fill="#000" stroke="none" stroke-width="1.2" opacity="0.55"/><text x="282" y="717" font-family="Inter, Helvetica, Arial, sans-serif" font-size="6" font-weight="400" fill="#fff" text-anchor="middle" letter-spacing="0">12:04</text><rect x="314" y="702" width="32" height="148" rx="6" fill="#e3e6ea" stroke="#c9ced6" stroke-width="1.2" opacity="1"/><text x="74" y="878" font-family="Inter, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#14161a" text-anchor="start" letter-spacing="0">The Ceremony</text><rect x="74" y="888" width="110" height="148" rx="6" fill="#e3e6ea" stroke="#c9ced6" stroke-width="1.2" opacity="1"/><line x1="74" y1="1036" x2="184" y2="888" stroke="#c9ced6" stroke-width="0.8"/><line x1="74" y1="888" x2="184" y2="1036" stroke="#c9ced6" stroke-width="0.8"/><rect x="146" y="894" width="32" height="12" rx="3" fill="#000" stroke="none" stroke-width="1.2" opacity="0.55"/><text x="162" y="903" font-family="Inter, Helvetica, Arial, sans-serif" font-size="6" font-weight="400" fill="#fff" text-anchor="middle" letter-spacing="0">12:04</text><rect x="194" y="888" width="110" height="148" rx="6" fill="#e3e6ea" stroke="#c9ced6" stroke-width="1.2" opacity="1"/><line x1="194" y1="1036" x2="304" y2="888" stroke="#c9ced6" stroke-width="0.8"/><line x1="194" y1="888" x2="304" y2="1036" stroke="#c9ced6" stroke-width="0.8"/><rect x="266" y="894" width="32" height="12" rx="3" fill="#000" stroke="none" stroke-width="1.2" opacity="0.55"/><text x="282" y="903" font-family="Inter, Helvetica, Arial, sans-serif" font-size="6" font-weight="400" fill="#fff" text-anchor="middle" letter-spacing="0">12:04</text><rect x="314" y="888" width="32" height="148" rx="6" fill="#e3e6ea" stroke="#c9ced6" stroke-width="1.2" opacity="1"/><circle cx="382" cy="175" r="9" fill="#fff" stroke="#d11a2a" stroke-width="1.4"/><text x="382" y="178.5" font-family="Inter, Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#d11a2a" text-anchor="middle" letter-spacing="0">1</text><circle cx="382" cy="396" r="9" fill="#fff" stroke="#d11a2a" stroke-width="1.4"/><text x="382" y="399.5" font-family="Inter, Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#d11a2a" text-anchor="middle" letter-spacing="0">2</text><circle cx="382" cy="506" r="9" fill="#fff" stroke="#d11a2a" stroke-width="1.4"/><text x="382" y="509.5" font-family="Inter, Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#d11a2a" text-anchor="middle" letter-spacing="0">3</text><circle cx="382" cy="570" r="9" fill="#fff" stroke="#d11a2a" stroke-width="1.4"/><text x="382" y="573.5" font-family="Inter, Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#d11a2a" text-anchor="middle" letter-spacing="0">4</text><circle cx="669" cy="116" r="9" fill="#fff" stroke="#d11a2a" stroke-width="1.4"/><text x="669" y="119.5" font-size="10" font-weight="700" fill="#d11a2a" text-anchor="middle">1</text><text x="686" y="120" font-size="11" fill="#14161a">No hamburger. Logo, search, profile avatar.</text><text x="686" y="134" font-size="11" fill="#14161a">Sticky, transparent over the billboard, solid</text><text x="686" y="148" font-size="11" fill="#14161a">on scroll.</text><circle cx="669" cy="174" r="9" fill="#fff" stroke="#d11a2a" stroke-width="1.4"/><text x="669" y="177.5" font-size="10" font-weight="700" fill="#d11a2a" text-anchor="middle">2</text><text x="686" y="178" font-size="11" fill="#14161a">Billboard: poster still paints instantly,</text><text x="686" y="192" font-size="11" fill="#14161a">trailer fades in only once it can play through.</text><text x="686" y="206" font-size="11" fill="#14161a">Exactly two buttons. Play goes to /watch —</text><text x="686" y="220" font-size="11" fill="#14161a">never inline.</text><circle cx="669" cy="246" r="9" fill="#fff" stroke="#d11a2a" stroke-width="1.4"/><text x="669" y="249.5" font-size="10" font-weight="700" fill="#d11a2a" text-anchor="middle">3</text><text x="686" y="250" font-size="11" fill="#14161a">Continue Watching sits ABOVE every genre row. A</text><text x="686" y="264" font-size="11" fill="#14161a">returning guest&#x27;s only intent is to resume.</text><circle cx="669" cy="290" r="9" fill="#fff" stroke="#d11a2a" stroke-width="1.4"/><text x="669" y="293.5" font-size="10" font-weight="700" fill="#d11a2a" text-anchor="middle">4</text><text x="686" y="294" font-size="11" fill="#14161a">Progress bar in accent on partially-watched</text><text x="686" y="308" font-size="11" fill="#14161a">cards. Duration badge top-right. Peeking third</text><text x="686" y="322" font-size="11" fill="#14161a">card is the scroll affordance.</text><circle cx="669" cy="348" r="9" fill="#fff" stroke="#d11a2a" stroke-width="1.4"/><text x="669" y="351.5" font-size="10" font-weight="700" fill="#d11a2a" text-anchor="middle">!</text><text x="686" y="352" font-size="11" fill="#14161a">Trending hides until ≥50 plays; New hides on a</text><text x="686" y="366" font-size="11" fill="#14161a">catalogue younger than 14 days. An empty or</text><text x="686" y="380" font-size="11" fill="#14161a">all-inclusive row reads as broken software.</text><circle cx="669" cy="406" r="9" fill="#fff" stroke="#d11a2a" stroke-width="1.4"/><text x="669" y="409.5" font-size="10" font-weight="700" fill="#d11a2a" text-anchor="middle">!</text><text x="686" y="410" font-size="11" fill="#14161a">Rows are registry-driven (doc 14). This page</text><text x="686" y="424" font-size="11" fill="#14161a">contains no switch on module type.</text></svg>