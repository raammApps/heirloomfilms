<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="780" viewBox="0 0 1180 780" font-family="Inter, Helvetica, Arial, sans-serif"><rect width="1180" height="780" fill="#ffffff"/><text x="40" y="46" font-size="19" font-weight="700" fill="#14161a">04 · Player — /watch/&lt;slug&gt;</text><text x="40" y="66" font-size="11.5" fill="#6b7280">Own route · the component the product is judged on</text><line x1="40" y1="84" x2="1140" y2="84" stroke="#9aa1ab" stroke-width="1"/><rect x="40" y="150" width="620" height="350" rx="8" fill="#1a1a1d" stroke="#14161a" stroke-width="1.5" opacity="1"/><rect x="48" y="158" width="604" height="334" rx="4" fill="#e3e6ea" stroke="#c9ced6" stroke-width="1.2" opacity="1"/><line x1="48" y1="492" x2="652" y2="158" stroke="#c9ced6" stroke-width="0.8"/><line x1="48" y1="158" x2="652" y2="492" stroke="#c9ced6" stroke-width="0.8"/><text x="350.0" y="329.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="9" font-weight="400" fill="#6b7280" text-anchor="middle" letter-spacing="0">video surface</text><circle cx="350.0" cy="315.0" r="26" fill="#fff" stroke="#14161a" stroke-width="1.2"/><text x="350.0" y="323.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#14161a" text-anchor="middle" letter-spacing="0">▶</text><rect x="48" y="434" width="604" height="58" rx="4" fill="#000" stroke="none" stroke-width="1.2" opacity="0.35"/><rect x="62" y="456" width="576" height="4" rx="2" fill="#fff" stroke="none" stroke-width="1.2" opacity="0.35"/><rect x="62" y="456" width="210" height="4" rx="2" fill="#d11a2a" stroke="none" stroke-width="1.2" opacity="1"/><circle cx="272" cy="458" r="6" fill="#d11a2a" stroke="#d11a2a" stroke-width="1.2"/><rect x="216" y="394" width="112" height="62" rx="4" fill="#e3e6ea" stroke="#c9ced6" stroke-width="1.2" opacity="1"/><text x="272" y="428" font-family="Inter, Helvetica, Arial, sans-serif" font-size="7" font-weight="400" fill="#6b7280" text-anchor="middle" letter-spacing="0">scrub preview</text><text x="272" y="446" font-family="Inter, Helvetica, Arial, sans-serif" font-size="7" font-weight="400" fill="#6b7280" text-anchor="middle" letter-spacing="0">7:08</text><text x="66" y="480" font-family="Inter, Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#fff" text-anchor="start" letter-spacing="0">▶</text><text x="96" y="480" font-family="Inter, Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#fff" text-anchor="start" letter-spacing="0">⟲10</text><text x="126" y="480" font-family="Inter, Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#fff" text-anchor="start" letter-spacing="0">10⟳</text><text x="156" y="480" font-family="Inter, Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#fff" text-anchor="start" letter-spacing="0">🔊</text><text x="530" y="480" font-family="Inter, Helvetica, Arial, sans-serif" font-size="8.5" font-weight="400" fill="#fff" text-anchor="start" letter-spacing="0">CC</text><text x="562" y="480" font-family="Inter, Helvetica, Arial, sans-serif" font-size="8.5" font-weight="400" fill="#fff" text-anchor="start" letter-spacing="0">1x</text><text x="594" y="480" font-family="Inter, Helvetica, Arial, sans-serif" font-size="8.5" font-weight="400" fill="#fff" text-anchor="start" letter-spacing="0">1080p</text><text x="626" y="480" font-family="Inter, Helvetica, Arial, sans-serif" font-size="8.5" font-weight="400" fill="#fff" text-anchor="start" letter-spacing="0">⛶</text><rect x="62" y="174" width="250" height="30" rx="6" fill="#000" stroke="none" stroke-width="1.2" opacity="0.5"/><text x="74" y="193" font-family="Inter, Helvetica, Arial, sans-serif" font-size="9" font-weight="400" fill="#fff" text-anchor="start" letter-spacing="0">Resuming from 7:08  ·  Start over</text><circle cx="682" cy="190" r="9" fill="#fff" stroke="#d11a2a" stroke-width="1.4"/><text x="682" y="193.5" font-family="Inter, Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#d11a2a" text-anchor="middle" letter-spacing="0">1</text><circle cx="682" cy="458" r="9" fill="#fff" stroke="#d11a2a" stroke-width="1.4"/><text x="682" y="461.5" font-family="Inter, Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#d11a2a" text-anchor="middle" letter-spacing="0">2</text><circle cx="682" cy="480" r="9" fill="#fff" stroke="#d11a2a" stroke-width="1.4"/><text x="682" y="483.5" font-family="Inter, Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#d11a2a" text-anchor="middle" letter-spacing="0">3</text><circle cx="849" cy="116" r="9" fill="#fff" stroke="#d11a2a" stroke-width="1.4"/><text x="849" y="119.5" font-size="10" font-weight="700" fill="#d11a2a" text-anchor="middle">1</text><text x="866" y="120" font-size="11" fill="#14161a">Resume affordance shows for 6 seconds then</text><text x="866" y="134" font-size="11" fill="#14161a">fades. Position comes from the token response</text><text x="866" y="148" font-size="11" fill="#14161a">(resumeAtS), not from the client.</text><circle cx="849" cy="174" r="9" fill="#fff" stroke="#d11a2a" stroke-width="1.4"/><text x="849" y="177.5" font-size="10" font-weight="700" fill="#d11a2a" text-anchor="middle">2</text><text x="866" y="178" font-size="11" fill="#14161a">Scrub thumbnails from a VTT sprite. Start the</text><text x="866" y="192" font-size="11" fill="#14161a">ABR ladder at 480p and step up — never start at</text><text x="866" y="206" font-size="11" fill="#14161a">1080p and stall.</text><circle cx="849" cy="232" r="9" fill="#fff" stroke="#d11a2a" stroke-width="1.4"/><text x="849" y="235.5" font-size="10" font-weight="700" fill="#d11a2a" text-anchor="middle">3</text><text x="866" y="236" font-size="11" fill="#14161a">Controls auto-hide after 3s, reappear on any</text><text x="866" y="250" font-size="11" fill="#14161a">input, never hide while a control has focus.</text><text x="866" y="264" font-size="11" fill="#14161a">All ≥44px, all keyboard-mapped (space, ←/→, f,</text><text x="866" y="278" font-size="11" fill="#14161a">m, c).</text><circle cx="849" cy="304" r="9" fill="#fff" stroke="#d11a2a" stroke-width="1.4"/><text x="849" y="307.5" font-size="10" font-weight="700" fill="#d11a2a" text-anchor="middle">!</text><text x="866" y="308" font-size="11" fill="#14161a">On a 403 mid-playback, refresh the token</text><text x="866" y="322" font-size="11" fill="#14161a">silently and continue at the same second. NEVER</text><text x="866" y="336" font-size="11" fill="#14161a">restart the film.</text><circle cx="849" cy="362" r="9" fill="#fff" stroke="#d11a2a" stroke-width="1.4"/><text x="849" y="365.5" font-size="10" font-weight="700" fill="#d11a2a" text-anchor="middle">!</text><text x="866" y="366" font-size="11" fill="#14161a">Heartbeat POST /api/progress every 10s, on</text><text x="866" y="380" font-size="11" fill="#14161a">pause, and on unload via sendBeacon. A failed</text><text x="866" y="394" font-size="11" fill="#14161a">heartbeat must never interrupt playback.</text></svg>