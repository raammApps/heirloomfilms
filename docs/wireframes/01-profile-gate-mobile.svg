<svg xmlns="http://www.w3.org/2000/svg" width="940" height="900" viewBox="0 0 940 900" font-family="Inter, Helvetica, Arial, sans-serif"><rect width="940" height="900" fill="#ffffff"/><text x="40" y="46" font-size="19" font-weight="700" fill="#14161a">01 · Profile gate — mobile 360×800</text><text x="40" y="66" font-size="11.5" fill="#6b7280">First visit · sets the profile for Continue Watching</text><line x1="40" y1="84" x2="900" y2="84" stroke="#9aa1ab" stroke-width="1"/><rect x="52" y="120" width="316" height="706" rx="26" fill="#fff" stroke="#14161a" stroke-width="1.6" opacity="1"/><rect x="184.0" y="128" width="52" height="8" rx="4" fill="#14161a" stroke="none" stroke-width="1.2" opacity="1"/><rect x="60" y="150" width="300" height="660" rx="0" fill="#fff" stroke="none" stroke-width="1.2" opacity="1"/><rect x="60" y="150" width="300" height="660" rx="0" fill="#f7f7f8" stroke="none" stroke-width="1.2" opacity="1"/><text x="210.0" y="280" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#d11a2a" text-anchor="middle" letter-spacing="3">AANYAVIKRAMSTREAM</text><text x="210.0" y="322" font-family="Inter, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#14161a" text-anchor="middle" letter-spacing="0">Who&#x27;s watching?</text><rect x="100" y="348" width="84" height="84" rx="8" fill="#e3e6ea" stroke="#c9ced6" stroke-width="1.2" opacity="1"/><text x="142" y="402" font-family="Inter, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#8b9099" text-anchor="middle" letter-spacing="0">B</text><text x="142" y="454" font-family="Inter, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="400" fill="#14161a" text-anchor="middle" letter-spacing="0">Bride&#x27;s side</text><rect x="236" y="348" width="84" height="84" rx="8" fill="#e3e6ea" stroke="#c9ced6" stroke-width="1.2" opacity="1"/><text x="278" y="402" font-family="Inter, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#8b9099" text-anchor="middle" letter-spacing="0">G</text><text x="278" y="454" font-family="Inter, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="400" fill="#14161a" text-anchor="middle" letter-spacing="0">Groom&#x27;s side</text><rect x="100" y="500" width="84" height="84" rx="8" fill="#e3e6ea" stroke="#c9ced6" stroke-width="1.2" opacity="1"/><text x="142" y="554" font-family="Inter, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#8b9099" text-anchor="middle" letter-spacing="0">F</text><text x="142" y="606" font-family="Inter, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="400" fill="#14161a" text-anchor="middle" letter-spacing="0">Friends</text><rect x="236" y="500" width="84" height="84" rx="8" fill="#e3e6ea" stroke="#c9ced6" stroke-width="1.2" opacity="1"/><text x="278" y="554" font-family="Inter, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#8b9099" text-anchor="middle" letter-spacing="0">F</text><text x="278" y="606" font-family="Inter, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="400" fill="#14161a" text-anchor="middle" letter-spacing="0">Family</text><text x="210.0" y="746" font-family="Inter, Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#6b7280" text-anchor="middle" letter-spacing="0">Skip →</text><circle cx="382" cy="280" r="9" fill="#fff" stroke="#d11a2a" stroke-width="1.4"/><text x="382" y="283.5" font-family="Inter, Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#d11a2a" text-anchor="middle" letter-spacing="0">1</text><circle cx="382" cy="390" r="9" fill="#fff" stroke="#d11a2a" stroke-width="1.4"/><text x="382" y="393.5" font-family="Inter, Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#d11a2a" text-anchor="middle" letter-spacing="0">2</text><circle cx="382" cy="746" r="9" fill="#fff" stroke="#d11a2a" stroke-width="1.4"/><text x="382" y="749.5" font-family="Inter, Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#d11a2a" text-anchor="middle" letter-spacing="0">3</text><circle cx="609" cy="116" r="9" fill="#fff" stroke="#d11a2a" stroke-width="1.4"/><text x="609" y="119.5" font-size="10" font-weight="700" fill="#d11a2a" text-anchor="middle">1</text><text x="626" y="120" font-size="11" fill="#14161a">Per-couple app name (catalogue.app_name).</text><text x="626" y="134" font-size="11" fill="#14161a">Large, tracked out, animates in over ~600ms</text><text x="626" y="148" font-size="11" fill="#14161a">with a scale settle before tiles appear. That</text><text x="626" y="162" font-size="11" fill="#14161a">beat sells the reference.</text><circle cx="609" cy="188" r="9" fill="#fff" stroke="#d11a2a" stroke-width="1.4"/><text x="609" y="191.5" font-size="10" font-weight="700" fill="#d11a2a" text-anchor="middle">2</text><text x="626" y="192" font-size="11" fill="#14161a">Four FIXED labels, letter tiles, generated</text><text x="626" y="206" font-size="11" fill="#14161a">colours. Never a free-text personal name — this</text><text x="626" y="220" font-size="11" fill="#14161a">keeps the whole viewer side free of personal</text><text x="626" y="234" font-size="11" fill="#14161a">data. Tap target ≥84px.</text><circle cx="609" cy="260" r="9" fill="#fff" stroke="#d11a2a" stroke-width="1.4"/><text x="609" y="263.5" font-size="10" font-weight="700" fill="#d11a2a" text-anchor="middle">3</text><text x="626" y="264" font-size="11" fill="#14161a">Always skippable, remembered in localStorage.</text><text x="626" y="278" font-size="11" fill="#14161a">Drives Continue Watching and My List. Never</text><text x="626" y="292" font-size="11" fill="#14161a">gates content.</text><circle cx="609" cy="318" r="9" fill="#fff" stroke="#d11a2a" stroke-width="1.4"/><text x="609" y="321.5" font-size="10" font-weight="700" fill="#d11a2a" text-anchor="middle">!</text><text x="626" y="322" font-size="11" fill="#14161a">Creates a profiles row server-side; the client</text><text x="626" y="336" font-size="11" fill="#14161a">keeps only the opaque id.</text></svg>