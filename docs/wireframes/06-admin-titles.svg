<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" font-family="Inter, Helvetica, Arial, sans-serif"><rect width="1440" height="820" fill="#ffffff"/><text x="40" y="46" font-size="19" font-weight="700" fill="#14161a">06 · Admin — titles &amp; upload</text><text x="40" y="66" font-size="11.5" fill="#6b7280">The screen the pitch depends on</text><line x1="40" y1="84" x2="1400" y2="84" stroke="#9aa1ab" stroke-width="1"/><rect x="40" y="140" width="800" height="620" rx="8" fill="#fff" stroke="#14161a" stroke-width="1.5" opacity="1"/><rect x="40" y="140" width="130" height="620" rx="8" fill="#f4f5f7" stroke="none" stroke-width="1.2" opacity="1"/><text x="56" y="184" font-family="Inter, Helvetica, Arial, sans-serif" font-size="9" font-weight="700" fill="#14161a" text-anchor="start" letter-spacing="0">Catalogues</text><text x="56" y="210" font-family="Inter, Helvetica, Arial, sans-serif" font-size="9" font-weight="400" fill="#14161a" text-anchor="start" letter-spacing="0">Billing</text><text x="56" y="236" font-family="Inter, Helvetica, Arial, sans-serif" font-size="9" font-weight="400" fill="#14161a" text-anchor="start" letter-spacing="0">Settings</text><line x1="170" y1="140" x2="170" y2="760" stroke="#9aa1ab" stroke-width="1.2"/><text x="190" y="174" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#14161a" text-anchor="start" letter-spacing="0">Aanya &amp; Vikram</text><text x="190" y="190" font-family="Inter, Helvetica, Arial, sans-serif" font-size="8" font-weight="400" fill="#6b7280" text-anchor="start" letter-spacing="0">aanya-vikram.heirloom.app  ·  Draft</text><text x="190" y="218" font-family="Inter, Helvetica, Arial, sans-serif" font-size="8.5" font-weight="400" fill="#4b5563" text-anchor="start" letter-spacing="0">Overview</text><text x="264" y="218" font-family="Inter, Helvetica, Arial, sans-serif" font-size="8.5" font-weight="700" fill="#d11a2a" text-anchor="start" letter-spacing="0