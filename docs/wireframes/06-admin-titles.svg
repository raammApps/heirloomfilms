dth="52" height="36" rx="4" fill="#e3e6ea" stroke="#c9ced6" stroke-width="1.2" opacity="1"/><text x="262" y="464" font-family="Inter, Helvetica, Arial, sans-serif" font-size="9" font-weight="600" fill="#14161a" text-anchor="start" letter-spacing="0">drone_pass.mp4</text><text x="262" y="478" font-family="Inter, Helvetica, Arial, sans-serif" font-size="7.5" font-weight="400" fill="#6b7280" text-anchor="start" letter-spacing="0">From Above  ·  —</text><rect x="630" y="458" width="66" height="18" rx="9" fill="none" stroke="#d11a2a" stroke-width="1.2" opacity="1"/><text x="663" y="470" font-family="Inter, Helvetica, Arial, sans-serif" font-size="7.5" font-weight="400" fill="#d11a2a" text-anchor="middle" letter-spacing="0">uploading</text><rect x="262" y="484" width="200" height="3" rx="2" fill="#c9ced6" stroke="none" stroke-width="1.2" opacity="1"/><rect x="262" y="484" width="124.0" height="3" rx="2" fill="#d11a2a" stroke="none" stroke-width="1.2" opacity="1"/><text x="472" y="487" font-family="Inter, Helvetica, Arial, sans-serif" font-size="6.5" font-weight="400" fill="#6b7280" text-anchor="start" letter-spacing="0">62%  ·  4.1GB of 6.6GB</text><text x="720" y="470" font-family="Inter, Helvetica, Arial, sans-serif" font-size="8" font-weight="400" fill="#d11a2a" text-anchor="start" letter-spacing="0">Edit</text><rect x="752" y="461" width="26" height="14" rx="7" fill="none" stroke="#c9ced6" stroke-width="1.2" opacity="1"/><text x="796" y="471" font-family="Inter, Helvetica, Arial, sans-serif" font-size="7.5" font-weight="400" fill="#6b7280" text-anchor="start" letter-spacing="0">Live</text><rect x="190" y="504" width="628" height="54" rx="6" fill="#fff" stroke="#c9ced6" stroke-width="1.2" opacity="1"/><rect x="200" y="513" width="52" height="36" rx="4" fill="#e3e6ea" stroke="#c9ced6" stroke-width="1.2" opacity="1"/><text x="262" y="526" font-family="Inter, Helvetica, Arial, sans-serif" font-size="9" font-weight="600" fill="#14161a" text-anchor="start" letter-spacing="0">pre_wedding_teaser.mp4</text><text x="262" y="540" font-family="Inter, Helvetica, Arial, sans-serif" font-size="7.5" font-weight="400" fill="#6b7280" text-anchor="start" letter-spacing="0">Pre-Wedding  ·  —</text><rect x="630" y="520" width="66" height="18" rx="9" fill="none" stroke="#e0685f" stroke-width="1.2" opacity="1"/><text x="663" y="532" font-family="Inter, Helvetica, Arial, sans-serif" font-size="7.5" font-weight="400" fill="#e0685f" text-anchor="middle" letter-spacing="0">failed</text><text x="262" y="551" font-family="Inter, Helvetica, Arial, sans-serif" font-size="6.5" font-weight="400" fill="#e0685f" text-anchor="start" letter-spacing="0">Unsupported audio codec · Retry</text><text x="720" y="532" font-family="Inter, Helvetica, Arial, sans-serif" font-size="8" font-weight="400" fill="#d11a2a" text-anchor="start" letter-spacing="0">Edit</text><rect x="752" y="523" width="26" height="14" rx="7" fill="none" stroke="#c9ced6" stroke-width="1.2" opacity="1"/><text x="796" y="533" font-family="Inter, Helvetica, Arial, sans-serif" font-size="7.5" font-weight="400" fill="#6b7280" text-anchor="start" letter-spacing="0">Live</text><circle cx="862" cy="268" r="9" fill="#fff" stroke="#d11a2a" stroke-width="1.4"/><text x="862" y="271.5" font-family="Inter, Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#d11a2a" text-anchor="middle" letter-spacing="0">1</text><circle cx="862" cy="380" r="9" fill="#fff" stroke="#d11a2a" stroke-width="1.4"/><text x="862" y="383.5" font-family="Inter, Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#d11a2a" text-anchor="middle" letter-spacing="0">2</text><circle cx="862" cy="442" r="9" fill="#fff" stroke="#d11a2a" stroke-width="1.4"/><text x="862" y="445.5" font-family="Inter, Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#d11a2a" text-anchor="middle" letter-spacing="0">3</text><circle cx="862" cy="504" r="9" fill="#fff" stroke="#d11a2a" stroke-width="1.4"/><text x="862" y="507.5" font-family="Inter, Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#d11a2a" text-anchor="middle" letter-spacing="0">4</text><circle cx="1109" cy="116" r="9" fill="#fff" stroke="#d11a2a" stroke-width="1.4"/><text x="1109" y="119.5" font-size="10" font-weight="700" fill="#d11a2a" text-anchor="middle">1</text><text x="1126" y="120" font-size="11" fill="#14161a">Upload starts immediately and keeps running</text><text x="1126" y="134" font-size="11" fill="#14161a">while the operator navigates anywhere in the</text><text x="1126" y="148" font-size="11" fill="#14161a">admin. Navigating away must never cancel it.</text><circle cx="1109" cy="174" r="9" fill="#fff" stroke="#d11a2a" stroke-width="1.4"/><text x="1109" y="177.5" font-size="10" font-weight="700" fill="#d11a2a" text-anchor="middle">2</text><text x="1126" y="178" font-size="11" fill="#14161a">titles row is created at &#x27;uploading&#x27; the moment</text><text x="1126" y="192" font-size="11" fill="#14161a">upload starts, so a refresh shows the file</text><text x="1126" y="206" font-size="11" fill="#14161a">rather than losing it.</text><circle cx="1109" cy="232" r="9" fill="#fff" stroke="#d11a2a" stroke-width="1.4"/><text x="1109" y="235.5" font-size="10" font-weight="700" fill="#d11a2a" text-anchor="middle">3</text><text x="1126" y="236" font-size="11" fill="#14161a">TUS resumable, 5MB chunks, offsets in</text><text x="1126" y="250" font-size="11" fill="#14161a">IndexedDB. Killing the network at 62% and</text><text x="1126" y="264" font-size="11" fill="#14161a">restoring resumes at ~62%, not 0. Test this</text><text x="1126" y="278" font-size="11" fill="#14161a">explicitly.</text><circle cx="1109" cy="304" r="9" fill="#fff" stroke="#d11a2a" stroke-width="1.4"/><text x="1109" y="307.5" font-size="10" font-weight="700" fill="#d11a2a" text-anchor="middle">4</text><text x="1126" y="308" font-size="11" fill="#14161a">A failure states the provider&#x27;s actual reason</text><text x="1126" y="322" font-size="11" fill="#14161a">and offers retry. Never a title silently</text><text x="1126" y="336" font-size="11" fill="#14161a">missing from a couple&#x27;s wedding catalogue.</text><circle cx="1109" cy="362" r="9" fill="#fff" stroke="#d11a2a" stroke-width="1.4"/><text x="1109" y="365.5" font-size="10" font-weight="700" fill="#d11a2a" text-anchor="middle">!</text><text x="1126" y="366" font-size="11" fill="#14161a">&#x27;Live&#x27; toggle = published. Processing and</text><text x="1126" y="380" font-size="11" fill="#14161a">failed titles are visible to the operator and</text><text x="1126" y="394" font-size="11" fill="#14161a">hidden from guests.</text></svg>