<svg xmlns="http://www.w3.org/2000/svg" width="960" height="880" viewBox="0 0 960 880" font-family="Inter, Helvetica, Arial, sans-serif"><rect width="960" height="880" fill="#ffffff"/><text x="40" y="46" font-size="19" font-weight="700" fill="#14161a">03 · Title detail modal — mobile</text><text x="40" y="66" font-size="11.5" fill="#6b7280">Deep-linkable · back-aware · prefetches playback</text><line x1="40" y1="84" x2="920" y2="84" stroke="#9aa1ab" stroke-width="1"/><rect x="52" y="120" width="316" height="706" rx="26" fill="#fff" stroke="#14161a" stroke-width="1.6" opacity="1"/><rect x="184.0" y="128" width="52" height="8" rx="4" fill="#14161a" stroke="none" stroke-width="1.2" opacity="1"/><rect x="60" y="150" width="300" height="660" rx="0" fill="#fff" stroke="none" stroke-width="1.2" opacity="1"/><rect x="60" y="150" width="300" height="660" rx="0" fill="#e9eaec" stroke="none" stroke-width="1.2" opacity="1"/><rect x="70" y="206" width="280" height="574" rx="14" fill="#fff" stroke="#14161a" stroke-width="1.5" opacity="1"/><rect x="70" y="206" width="280" height="158" rx="14" fill="#e3e6ea" stroke="#c9ced6" stroke-width="1.2" opacity="1"/><line x1="70" y1="364" x2="350" y2="206" stroke="#c9ced6" stroke-width="0.8"/><line x1="70" y1="206" x2="350" y2="364" stroke="#c9ced6" stroke-width="0.8"/><text x="210.0" y="289.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="9" font-weight="400" fill="#6b7280" text-anchor="middle" letter-spacing="0">poster / preview</text><circle cx="330" cy="226" r="11" fill="#fff" stroke="#14161a" stroke-width="1.2"/><text x="330" y="230" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#14161a" text-anchor="middle" letter-spacing="0">×</text><text x="84" y="392" font-family="Inter, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#14161a" text-anchor="start" letter-spacing="0">The Sangeet Film</text><text x="84" y="410" font-family="Inter, Helvetica, Arial, sans-serif" font-size="8" font-weight="400" fill="#4b5563" text-anchor="start" letter-spacing="0">21:24  ·  Sangeet  ·  13 Nov 2026</text><rect x="84" y="422" width="106" height="30" rx="15.0" fill="#d11a2a" stroke="#d11a2a" stroke-width="1.3" opacity="1"/><text x="137.0" y="440.5" font-family="Inter, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="600" fill="#fff" text-anchor="middle" letter-spacing="0">▶  Play</text><rect x="198" y="422" width="106" height="30" rx="15.0" fill="none" stroke="#14161a" stroke-width="1.3" opacity="1"/><text x="251.0" y="440.5" font-family="Inter, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="600" fill="#14161a" text-anchor="middle" letter-spacing="0">+  My List</text><rect x="84" y="470" width="252.0" height="4" rx="2" fill="#c9ced6" stroke="none" stroke-width="1.2" opacity="1"/><rect x="84" y="479" width="206.64" height="4" rx="2" fill="#c9ced6" stroke="none" stroke-width="1.2" opacity="1"/><rect x="84" y="488" width="151.2" height="4" rx="2" fill="#c9ced6" stroke="none" stroke-width="1.2" opacity="1"/><rect x="84" y="497" width="226.8" height="4" rx="2" fill="#c9ced6" stroke="none" stroke-width="1.2" opacity="1"/><line x1="84" y1="522" x2="336" y2="522" stroke="#c9ced6" stroke-width="1.2"/><text x="84" y="542" font-family="Inter, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#14161a" text-anchor="start" letter-spacing="0">Credits</text><text x="84" y="558" font-family="Inter, Helvetica, Arial, sans-serif" font-size="8" font-weight="400" fill="#4b5563" text-anchor="start" letter-spacing="0">Cinematography · Studio Name</text><text x="84" y="572" font-family="Inter, Helvetica, Arial, sans-serif" font-size="8" font-weight="400" fill="#4b5563" text-anchor="start" letter-spacing="0">Edit · Name</text><circle cx="374" cy="226" r="9" fill="#fff" stroke="#d11a2a" stroke-width="1.4"/><text x="374" y="229.5" font-family="Inter, Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#d11a2a" text-anchor="middle" letter-spacing="0">1</text><circle cx="374" cy="422" r="9" fill="#fff" stroke="#d11a2a" stroke-width="1.4"/><text x="374" y="425.5" font-family="Inter, Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#d11a2a" text-anchor="middle" letter-spacing="0">2</text><circle cx="374" cy="392" r="9" fill="#fff" stroke="#d11a2a" stroke-width="1.4"/><text x="374" y="395.5" font-family="Inter, Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#d11a2a" text-anchor="middle" letter-spacing="0">3</text><circle cx="629" cy="116" r="9" fill="#fff" stroke="#d11a2a" stroke-width="1.4"/><text x="629" y="119.5" font-size="10" font-weight="700" fill="#d11a2a" text-anchor="middle">1</text><text x="646" y="120" font-size="11" fill="#14161a">Esc + scrim close. Focus trapped, returns to</text><text x="646" y="134" font-size="11" fill="#14161a">the originating card. Android hardware back</text><text x="646" y="148" font-size="11" fill="#14161a">closes the modal, not the site.</text><circle cx="629" cy="174" r="9" fill="#fff" stroke="#d11a2a" stroke-width="1.4"/><text x="629" y="177.5" font-size="10" font-weight="700" fill="#d11a2a" text-anchor="middle">2</text><text x="646" y="178" font-size="11" fill="#14161a">PREFETCH the HLS manifest and first segment</text><text x="646" y="192" font-size="11" fill="#14161a">when this modal OPENS. This is where the</text><text x="646" y="206" font-size="11" fill="#14161a">sub-1.5s playback target is actually won — by</text><text x="646" y="220" font-size="11" fill="#14161a">the time Play is tapped the first segment is</text><text x="646" y="234" font-size="11" fill="#14161a">warm.</text><circle cx="629" cy="260" r="9" fill="#fff" stroke="#d11a2a" stroke-width="1.4"/><text x="629" y="263.5" font-size="10" font-weight="700" fill="#d11a2a" text-anchor="middle">3</text><text x="646" y="264" font-size="11" fill="#14161a">pushState ?title=&lt;slug&gt; so it deep-links and</text><text x="646" y="278" font-size="11" fill="#14161a">shares. ←/→ move between siblings using</text><text x="646" y="292" font-size="11" fill="#14161a">replaceState, so back exits the modal rather</text><text x="646" y="306" font-size="11" fill="#14161a">than walking every card visited.</text><circle cx="629" cy="332" r="9" fill="#fff" stroke="#d11a2a" stroke-width="1.4"/><text x="629" y="335.5" font-size="10" font-weight="700" fill="#d11a2a" text-anchor="middle">!</text><text x="646" y="336" font-size="11" fill="#14161a">Order: poster → title → duration/category/date</text><text x="646" y="350" font-size="11" fill="#14161a">→ Play + My List → synopsis → credits.</text></svg>